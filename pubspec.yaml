name: free_scanner
description: Completely Free, fully offline document scanner.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_mlkit_document_scanner:
    path: packages/google_mlkit_document_scanner
  google_mlkit_text_recognition: ^0.13.0
  path_provider: ^2.1.3
  path: ^1.9.0
  pdf: ^3.10.8
  share_plus: ^9.0.0
  image: ^4.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/free_scanner_icon.png
